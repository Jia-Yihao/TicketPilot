[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketpilot"
version = "0.1.0"
description = "Deterministic workflow + bounded agent after-sales service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "pydantic-ai-slim[anthropic]>=2.60,<3",
]

[project.optional-dependencies]
# Shared rate-limit budgets across workers; the default install stays on the
# in-process token bucket.
redis = [
    "redis>=5,<6",
]
# Retrieval fine-tuning only (scripts/finetune_embedder.py). Kept out of the
# default install and out of requirements.lock: the service and the CI gate
# never embed locally, so neither needs torch.
finetune = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "resources/policies/*",
    "resources/catalog/*",
    "agent/intents.yaml",
    "agent/escalation.yaml",
    "agent/refund_reason_rules.yaml",
    "agent/counter_question.yaml",
    "core/approval_tiers.yaml",
    "core/online_signals.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
# Migrations are generated; their column and index definitions cannot be
# wrapped without changing what the statement means.
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
