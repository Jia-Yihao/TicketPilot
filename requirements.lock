# requirements.lock — 安装产物快照（inventory snapshot），不是依赖真源。
# 直接依赖的唯一真源是 pyproject.toml；本文件只固化项目 venv 当前实际安装的
# 完整包版本，供 CI 与 Docker 以同形两段安装复现同一环境：
#   pip install --no-cache-dir -r requirements.lock
#   pip install --no-deps .
# 生成命令（在仓库根，使用项目 venv 解释器）：
#   ./.venv/Scripts/python.exe -m pip freeze
#   （若 venv 缺 pip 模块，先用 Python 自带标准库引导，不引入外部工具链：
#     ./.venv/Scripts/python.exe -m ensurepip --upgrade）
# 与原始 freeze 输出的唯一差异：剔除项目自身的 editable 安装两行
# （"# Editable Git install with no remote (ticketpilot==0.1.0)" 注释行及其后的
# "-e d:\code\ticketpilot" 行），项目本体由第二段 "--no-deps ." 安装。
# 其余各行与 freeze 输出逐字一致，请勿手工编辑。
