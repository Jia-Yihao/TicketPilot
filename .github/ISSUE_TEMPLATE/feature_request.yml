name: "Feature request"
description: "提出一个符合项目范围的新能力或改进"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目刻意保持「确定性工作流骨架 + 有界语言模型节点」。
        通用 Memory、多 Agent 协作、向量检索、真实支付渠道等**不在 MVP 范围**。
        如果你的想法会削弱四眼审批、幂等、对账或租户隔离，请先说明为什么安全边界不受影响。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与当前阻塞点，而不是先给实现方案
      placeholder: |
        运营在审批页看不到订单的历史退款记录，需要来回切换任务详情……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 接口、状态机或界面上的改动；如果涉及金额或权限，写清楚不变量
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过但放弃的方案
      description: 为什么不选它们（复杂度、安全边界、演示范围）
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 后端 API / 任务运行时
        - 退款审批与对账
        - 客服 Agent / 渐进式披露
        - 控制台（React）
        - 数据、评测与文档
        - 构建 / 部署 / CI
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认这与现有安全边界不冲突
          required: true
        - label: 这是可讨论的产品建议，不是安全漏洞（安全漏洞请走私密报告）
          required: true
