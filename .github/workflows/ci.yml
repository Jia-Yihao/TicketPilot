name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --no-cache-dir -r requirements.lock
      - run: pip install --no-deps .
      - run: ruff check app tests scripts evals alembic
      - run: python -m mypy app
      - run: python -m pytest -q
      - run: python evals/run.py
      - run: python evals/support_run.py
      - run: python evals/support_run.py --dataset evals/analytics_dimension_set.json --partial
      - run: python evals/support_run.py --dataset evals/memory_personalization_set.json --partial
      - run: python evals/retrieval_metrics.py --channels bm25,hybrid
      - run: python scripts/build_intent_set.py --check
      - run: python evals/intent_metrics.py --enforce
      - run: python evals/replay.py --self-check
      - run: python evals/answer_metrics.py --enforce
      - run: alembic -x db_url=sqlite+pysqlite:///./ci.db upgrade head
      - run: alembic -x db_url=sqlite+pysqlite:///./ci.db check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketpilot
          POSTGRES_USER: ticketpilot
          POSTGRES_PASSWORD: ticketpilot-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketpilot -d ticketpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --no-cache-dir -r requirements.lock
      - run: pip install --no-deps .
      - run: >-
          alembic
          -x db_url=postgresql+psycopg://ticketpilot:ticketpilot-ci-only@localhost:5432/ticketpilot
          upgrade head
      - run: >-
          alembic
          -x db_url=postgresql+psycopg://ticketpilot:ticketpilot-ci-only@localhost:5432/ticketpilot
          check
