# 架构依赖守卫的策略。
#
# `tests/test_architecture_guard.py` 按这份文件检查 `app/` 的 import 图。
# 这份文件是「架构约束」的唯一事实源：约束写在这里，测试负责执行，
# 不允许把规则藏在测试代码里。
#
# 层次自下而上（tier 越大越靠上）：
#
#   0  基础件    core（配置 / 错误 / 策略 / 时间 / 安全）/ observability（脱敏、追踪）/ db（会话）
#   1  形状      models（ORM）/ schemas（接口形状）
#   2  数据与检索 repositories（仓储）/ retrieval（切块、融合、重排）/ sql（受控查询）
#   3  能力      tools（工具执行）/ agent（意图与抽取）/ channels（渠道适配）
#   4  编排      services（用例编排）
#   5  入口      api（HTTP 路由与依赖注入）
#   -  组装根    main / seed / asgi：组合根是装配点，豁免下面所有方向规则
#
# 规则：
#   1. 层必须声明：`app/` 下每个含 .py 的目录都要在这里出现，否则守卫直接失败。
#      加一层是要做决定的，不是顺手的事。
#   2. 依赖只能严格向下：跨层依赖必须 tier(源) > tier(目标)。
#      反向依赖（低层依赖高层）与同层跨层耦合一律违规，必须登记进 `exceptions`。
#   3. `forbidden` 里的边一律不许出现，哪怕方向是向下的。
#   4. 不许有层间互环：两层互相依赖时，至少有一个方向必须登记进 `exceptions`。
#   5. 不许有模块级 import 环（Python 运行时才炸，测试里先炸）。
#   6. 登记不许腐化：`exceptions` 与 `known_deviations` 里的每条边必须真的还在用。
#      修好了就删掉登记，别留着当借口。
#
# 改这份文件等于改架构，请走 ADR。

tiers:
  core: 0
  observability: 0
  db: 0
  models: 1
  schemas: 1
  repositories: 2
  retrieval: 2
  sql: 2
  tools: 3
  agent: 3
  channels: 3
  services: 4
  api: 5

# 组合根：这些模块是装配点，允许依赖任何层，豁免规则 2、3、4。
roots:
  - main
  - seed
  - asgi

# 明知的反向依赖与同层耦合。每条都要写清为什么——写不清就说明它该被改掉，
# 而不是被登记。
exceptions:
  - from: agent
    to: services
    why: >-
      agent 需要读写业务状态（catalog / runtime / support / handoff），
      是当前实现的已知反向依赖；正解是把这些调用收到 ports 后面，尚未做。
      与之配对的是 services -> agent（编排层回调 agent 做意图判定），
      两者构成 services 与 agent 的层间互环，同一个根因。
  - from: tools
    to: services
    why: >-
      内置工具要真的下单、退款、开票，直接调 orders / refunds / tickets 等业务服务；
      这些服务目前还没有被抽成工具层的依赖倒置接口。
      与之配对的是 services -> tools（编排层把工具执行器当能力调用），
      两者构成 services 与 tools 的层间互环，同一个根因。
  - from: channels
    to: agent
    why: >-
      渠道网关要对入站消息做意图识别（决定回哪一个技能），
      所以渠道层要知道 agent 的判定入口；两者同层，这一层耦合还没拆成端口。
  - from: core
    to: observability
    why: >-
      输入护栏要先脱敏再比对（core.guard 用 observability.redaction）。
      两者都是基础件，这条横切依赖暂时留在层内。

# 明确禁止的依赖：哪怕方向是向下的也不许。
forbidden:
  - from: api
    to: retrieval
    why: HTTP 层不许直接碰检索，必须经 services 取结果。
  - from: api
    to: tools
    why: HTTP 层不许直接调工具，必须经 services 编排。
  - from: api
    to: db
    why: HTTP 层不许自己拿 session，数据访问走 repositories / services。
  - from: models
    to: schemas
    why: ORM 模型不依赖接口形状层，两个方向都要能独立改。
  - from: repositories
    to: retrieval
    why: 仓储只做数据存取，不做检索编排。
  - from: retrieval
    to: repositories
    why: 检索只读模型（只读查询），不写仓储。

# 已知但未修的偏离：方向不违规，但绕过了应有的层。守卫不阻断，只记录。
# 修完就从这里删掉。
known_deviations:
  - edge: api -> sql
    why: >-
      统计端点直接用受控 SQL 服务（analytics / sql_queries），
      改走 services 需要先把 SQL 查询下沉一层，尚未做。
