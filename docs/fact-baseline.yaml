# 文档一致性守卫的清单。
#
# 这份文件只写两件事：某个数字「在哪个文件的哪一行」，
# 以及「用哪个正则把数字抠出来」。
#
# 数字本身不写在这里。数字的唯一定义在代码里，
# 由 `tests/test_docs_consistency.py` 现算现比：
#
#     代码现算的值  ==  文档里写的值   →  通过
#     代码现算的值  !=  文档里写的值   →  守卫失败，并指出是哪一行
#
# 清单里一旦出现字面数字，它就变成第二份事实源，
# 那样这个守卫自己就会漂——它会拿旧数字去对新代码，然后一直报同样的错。
#
# 字段：
#   file       仓库相对路径
#   anchor     该文件里唯一、且**不含数字**的一小段文字，用来定位这一行
#              （不含数字是硬要求：锚点里藏数字等于把事实值复制一份）
#   pattern    正则，至少一个捕获组；数字在捕获组里
#   group      用第几个捕获组，默认 1
#   in_manual  这条说法也必须出现在说明书（docx）里，默认 false
#
# 改这份清单不用走 ADR（它只是「去哪里核对」）；
# 改「事实」本身（代码、接口、模型）要走 ADR。

facts:
  openapi_paths:
    label: OpenAPI 路径数
    claims:
      - file: README.md
        anchor: "完整契约见"
        pattern: '共\s*\d+\s*个操作（(\d+)\s*条路径'
      - file: docs/spec/项目规格.md
        anchor: "OpenAPI 里共"
        pattern: '\*\*\d+\s*个操作 / (\d+)\s*条路径\*\*'
        in_manual: true
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: '复核为 \*\*(\d+) 条路径'
        in_manual: true
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '(\d+) 个 API 路径'
      - file: docs/下一步规划.md
        anchor: "当前规模事实"
        pattern: 'OpenAPI (\d+) 个路径'

  openapi_operations:
    label: OpenAPI 操作数
    claims:
      - file: README.md
        anchor: "完整契约见"
        pattern: '共\s*(\d+)\s*个操作'
      - file: docs/spec/项目规格.md
        anchor: "OpenAPI 里共"
        pattern: '\*\*(\d+)\s*个操作'
        in_manual: true
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: '复核为 \*\*\d+ 条路径 / (\d+) 个操作'
        in_manual: true
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '/ (\d+) 个操作'
      - file: docs/下一步规划.md
        anchor: "当前规模事实"
        pattern: '个路径 / (\d+) 个操作'

  alembic_revisions:
    label: Alembic 迁移条数
    claims:
      - file: README.md
        anchor: "head 为"
        pattern: '(\d+)\s*条迁移，head 为'
      - file: docs/spec/项目规格.md
        anchor: "验证通过（"
        pattern: '\*\*(\d+)\s*条迁移、\d+\s*张表\*\*'
        in_manual: true
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: '(\d+)\*\* 条迁移'
        in_manual: true
      - file: docs/guide/范围与边界.md
        anchor: "无漂移（"
        pattern: '（(\d+)\s*条迁移、(\d+)\s*张表'
      - file: docs/下一步规划.md
        anchor: "当前规模事实"
        pattern: '(\d+)\s*条迁移'
      - file: CONTRIBUTING.md
        anchor: "当前迁移链"
        pattern: '当前迁移链 \*\*(\d+)\s*条\*\*'

  alembic_head:
    label: Alembic head 修订号
    claims:
      - file: README.md
        anchor: "head 为"
        pattern: 'head 为 ([0-9a-f]+)'
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: 'head `([0-9a-f]+)`'
        in_manual: true
      - file: docs/guide/范围与边界.md
        anchor: "无漂移（"
        pattern: 'head `([0-9a-f]+)`'
      - file: docs/下一步规划.md
        anchor: "当前规模事实"
        pattern: 'head `([0-9a-f]+)`'

  sql_tables:
    label: SQLAlchemy 表数
    claims:
      - file: docs/spec/项目规格.md
        anchor: "验证通过（"
        pattern: '\*\*\d+\s*条迁移、(\d+)\s*张表\*\*'
        in_manual: true
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: '(\d+)\*\* 张表'
        in_manual: true
      - file: docs/guide/范围与边界.md
        anchor: "无漂移（"
        pattern: '、(\d+)\s*张表'
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '(\d+) 张表'

  app_py_files:
    label: app/ 下的 Python 文件数
    claims:
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: 'app/` (\d+) 个文件'
      - file: CONTRIBUTING.md
        anchor: "strict 模式，零错误"
        pattern: '零错误（(\d+) 个文件）'

  mypy_files:
    label: mypy strict 实际检查的 app/ 文件数
    claims:
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: 'mypy strict \*\*(\d+)\*\* 个文件'
        in_manual: true
      - file: CONTRIBUTING.md
        anchor: "strict 模式，零错误"
        pattern: '零错误（(\d+) 个文件）'

  test_py_files:
    label: tests/ 下的 Python 文件数
    claims:
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '(\d+) 个测试文件'
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: '`tests/\*\.py` \*\*(\d+)\*\* 个文件'
        in_manual: true
      - file: docs/下一步规划.md
        anchor: "| 测试 |"
        pattern: '、(\d+) 个测试文件'

  test_collected:
    label: pytest 收集到的用例数
    claims:
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '收集 (\d+) 条用例'
      - file: docs/spec/项目规格.md
        anchor: "本轮收尾读数"
        pattern: '收集 \*\*(\d+)\*\* 条'
        in_manual: true
      - file: docs/下一步规划.md
        anchor: "| 测试 |"
        pattern: '（(\d+) collected'

  adr_count:
    label: ADR 篇数
    claims:
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '(\d+) 篇 ADR'
      - file: CONTRIBUTING.md
        anchor: "`docs/adr/` 当前"
        pattern: '当前 \*\*(\d+) 篇\*\*'

  golden_cases:
    label: Golden Set 用例数
    claims:
      - file: CONTRIBUTING.md
        anchor: "任务路径 Golden Set"
        pattern: '(\d+)/\d+ 任务路径'
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '离线用例 \d+ 条（(\d+) 任务'

  support_cases:
    label: 只读评测集用例数
    claims:
      - file: CONTRIBUTING.md
        anchor: "只读路径（含多轮澄清）"
        pattern: '(\d+)/\d+ 只读路径'
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '\+ (\d+) 只读'

  offline_cases:
    label: 离线用例总数
    claims:
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '离线用例 (\d+) 条'
      - file: docs/records/智能体平台设想.md
        anchor: "离线用例（含轨迹断言）"
        pattern: '(\d+) 条离线用例'

  console_pages:
    label: 控制台页面数
    claims:
      - file: docs/records/智能体平台设想.md
        anchor: "**规模事实**"
        pattern: '(\d+) 个控制台页面'
      - file: docs/records/智能体平台设想.md
        anchor: "**新能力的控制台页面"
        pattern: '(\d+) 个业务页面'

  settings_field_count:
    label: Settings 字段数
    claims:
      - file: docs/spec/项目规格.md
        anchor: "环境变量对账"
        pattern: '`Settings` \*\*(\d+)\*\* 个字段'
        in_manual: true
      - file: docs/records/智能体平台设想.md
        anchor: "环境变量对账"
        pattern: '`Settings` (\d+) 个字段'

  env_example_assignment_count:
    label: .env.example 有效赋值条数
    claims:
      - file: docs/spec/项目规格.md
        anchor: "环境变量对账"
        pattern: '`\.env\.example` \*\*(\d+)\*\* 条有效赋值'
        in_manual: true
      - file: docs/records/智能体平台设想.md
        anchor: "环境变量对账"
        pattern: '`\.env\.example` (\d+) 条有效赋值'

  env_reverse_violation_count:
    label: 环境变量反向违规条数
    claims:
      - file: docs/spec/项目规格.md
        anchor: "环境变量对账"
        pattern: '反向违规（赋值找不到字段）\*\*(\d+)\*\* 条'
        in_manual: true
      - file: docs/records/智能体平台设想.md
        anchor: "环境变量对账"
        pattern: '反向违规 (\d+) 条'

  env_fields_without_assignment_count:
    label: 无赋值的 Settings 字段数
    claims:
      - file: docs/spec/项目规格.md
        anchor: "环境变量对账"
        pattern: '正向缺口（字段无赋值）\*\*(\d+)\*\* 条'
        in_manual: true
      - file: docs/records/智能体平台设想.md
        anchor: "环境变量对账"
        pattern: '正向缺口 (\d+) 条'
